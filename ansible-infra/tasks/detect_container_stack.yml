---
# Detección del motor de contenedores y del comando Compose. Compartida por
# deploy-infra.yml y destroy-infra.yml para que ambos operandsen sobre los
# mismos facts `anomalia_*`. Solo módulos ansible.builtin, sin colecciones.
#
# Las tasks llevan `tags: always` para que los facts existan también en corridas
# acotadas (ej. `--tags firewall`), donde el resto de las pre_tasks se omiten.
- name: Detectar motor de contenedores (docker o podman)
  ansible.builtin.shell: |
    if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
      if docker info 2>/dev/null | grep -qi podman; then
        echo podman
      else
        echo docker
      fi
    elif command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
      echo podman
    else
      echo missing
    fi
  register: engine_detect
  changed_when: false
  check_mode: no
  tags: always

- name: Detectar comando de Compose (docker compose / docker-compose / podman-compose)
  ansible.builtin.shell: |
    if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
      echo "docker compose"
    elif command -v docker-compose >/dev/null 2>&1; then
      echo "docker-compose"
    elif command -v podman-compose >/dev/null 2>&1; then
      echo "podman-compose"
    else
      echo missing
    fi
  register: compose_detect
  changed_when: false
  check_mode: no
  tags: always

# Nota: los valores se resuelven todos antes de asignarse, por eso el socket se
# calcula desde los `register` y no desde los facts hermanos de esta misma task.
- name: Definir facts del motor de contenedores y Compose
  ansible.builtin.set_fact:
    anomalia_container_engine: "{{ engine_detect.stdout | trim }}"
    anomalia_engine_cmd: "{{ 'docker' if (engine_detect.stdout | trim) == 'docker' else 'podman' }}"
    anomalia_engine_service: "{{ 'docker.service' if (engine_detect.stdout | trim) == 'docker' else 'podman.socket' }}"
    anomalia_extra_host_gateway: "{{ 'host-gateway' if (engine_detect.stdout | trim) == 'docker' else 'host.containers.internal' }}"
    anomalia_compose_cmd: "{{ compose_detect.stdout | trim }}"
    anomalia_container_socket: >-
      {{ '/var/run/docker.sock'
         if ((engine_detect.stdout | trim) == 'docker'
             or (compose_detect.stdout | trim) in ['docker-compose', 'docker compose'])
         else '/run/podman/podman.sock' }}
  tags: always
