#   - vminsert_ip="192.168.1.50"                                                     #
#   - vmauth_ip="192.168.1.50"                                                       #
#   - vmagent_ip="192.168.1.51"                                                      #
#   - vmstorage_ip="..."                                                             #
# ===================================================================================#


