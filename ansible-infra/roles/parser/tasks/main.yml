---
- name: Crear directorio de despliegue para el parser en el nodo asignado a anomalia
  ansible.builtin.file:
    path: "/opt/anomalia/parser"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Copiar plantilla de Docker Compose para el parser con permisos de anomalia
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/anomalia/parser/docker-compose.yml"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0644'

- name: Asegurar que se descargue la última versión de la imagen
  ansible.builtin.shell: docker pull {{ parser_image }}
  become: yes
  become_user: "{{ nombre_usuario }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout or 'Image is up to date' not in pull_result.stdout"

- name: Limpiar contenedores previos del parser con docker-compose down
  ansible.builtin.shell: docker-compose down --remove-orphans || true
  args:
    chdir: "/opt/anomalia/parser"
  become: yes
  become_user: "{{ nombre_usuario }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
  changed_when: false

- name: Levantar stack de contenedores del parser con Docker Compose como usuario anomalia
  ansible.builtin.shell: docker-compose up -d
  args:
    chdir: "/opt/anomalia/parser"
  become: yes
  become_user: "{{ nombre_usuario }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
  register: result
  until: result.rc == 0
  retries: 3
  delay: 10
