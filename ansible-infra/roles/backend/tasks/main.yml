---
- name: Verificar si existe un docker-compose.yml previo en el servidor
  ansible.builtin.stat:
    path: "/opt/anomalia/backend/docker-compose.yml"
  register: compose_file

- name: Bajar el stack de contenedores previo y eliminar volúmenes si es necesario
  ansible.builtin.command: docker-compose down -v --remove-orphans
  args:
    chdir: "/opt/anomalia/backend"
  become: yes
  become_user: "{{ nombre_usuario }}"
  when: compose_file.stat.exists
  failed_when: false
  ignore_errors: true

- name: Crear directorio de despliegue para el backend asignado al usuario anomalia
  ansible.builtin.file:
    path: "/opt/anomalia/backend"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Crear subdirectorio local para la base de datos con permisos de anomalia
  ansible.builtin.file:
    path: "/opt/anomalia/backend/database"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Verificar si init.sql es un directorio por error previo
  ansible.builtin.stat:
    path: "/opt/anomalia/backend/database/init.sql"
  register: init_sql_stat

- name: Eliminar init.sql si por error es un directorio
  ansible.builtin.file:
    path: "/opt/anomalia/backend/database/init.sql"
    state: absent
  when: init_sql_stat.stat.isdir is defined and init_sql_stat.stat.isdir

- name: Renderizar plantilla de inicialización de base de datos bajo propiedad de anomalia
  ansible.builtin.template:
    src: "init.sql.j2"
    dest: "/opt/anomalia/backend/database/init.sql"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0644'

- name: Copiar código fuente del backend y archivos del frontend asignando propiedad a anomalia
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/"
    dest: "/opt/anomalia/backend/"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    remote_src: no

- name: Crear directorio de certificados SSL si no existe
  ansible.builtin.file:
    path: "/opt/anomalia/certs"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Verificar si existen certificados SSL
  ansible.builtin.stat:
    path: "/opt/anomalia/certs/fullchain.pem"
  register: cert_file

- name: Copiar plantilla de Docker Compose con integración de Pyroscope
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/anomalia/backend/docker-compose.yml"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0644'

- name: Crear directorio para playbooks adicionales en el nodo con permisos de anomalia
  ansible.builtin.file:
    path: "/opt/anomalia/backend/playbooks"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Copiar roles de Ansible al directorio de playbooks
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/"
    dest: "/opt/anomalia/backend/playbooks/roles/"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    remote_src: no

- name: Copiar playbooks de instalación al servidor bajo el usuario anomalia
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/anomalia/backend/playbooks/"
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0644'
  loop:
    - "install-binaries.yml"

- name: Reconstruir y levantar stack de contenedores con Docker Compose como usuario anomalia
  ansible.builtin.shell: docker-compose up -d --build
  args:
    chdir: "/opt/anomalia/backend"
  become: yes
  become_user: "{{ nombre_usuario }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
  register: result
  until: result.rc == 0
  retries: 3
  delay: 10
