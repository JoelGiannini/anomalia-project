version: '3.8'

networks:
  aiops-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: anomalia_postgres
    environment:
      POSTGRES_USER: anomal_user
      POSTGRES_PASSWORD: anomal_password
      POSTGRES_DB: anomal_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiops-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: anomalia_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
    networks:
      - aiops-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: anomalia_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/anomal_db
      KC_DB_USERNAME: anomal_user
      KC_DB_PASSWORD: anomal_password
      KC_HOSTNAME: anomalia.local
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      - postgres
    networks:
      - aiops-net
    restart: unless-stopped

  anomaliagw:
    build: ./backend
    container_name: anomalia_gw
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://anomal_user:anomal_password@postgres:5432/anomal_db
      - AI_PROVIDER=ollama
      - OLLAMA_HOST=http://anomalia_ollama:11434
      - OLLAMA_MODEL=llama3.2
      - OIDC_ISSUER_URL=http://anomalia.local:8080/realms/aiops
    extra_hosts:
      - "anomalia.local:host-gateway"
    depends_on:
      - postgres
      - ollama
      - keycloak
    networks:
      - aiops-net
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
