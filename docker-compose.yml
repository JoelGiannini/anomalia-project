version: '3.8'

networks:
  aiops-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: anomalia_postgres
    environment:
      POSTGRES_USER: anomal_user
      POSTGRES_PASSWORD: anomal_password
      POSTGRES_DB: anomal_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomal_user -d anomal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiops-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: anomalia_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
    networks:
      - aiops-net
    restart: unless-stopped

  anomaliagw:
    build: ./backend
    container_name: anomalia_gw
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://anomal_user:anomal_password@postgres:5432/anomal_db
      - AI_PROVIDER=ollama
      - OLLAMA_HOST=http://anomalia_ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    extra_hosts:
      - "anomalia.local:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - aiops-net
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
